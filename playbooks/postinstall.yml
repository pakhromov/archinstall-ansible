- name: Postinstall
  hosts: chroot

  vars_prompt:
    - name: user_password_hash
      prompt: Password for root and user
      private: true
      confirm: true
      encrypt: sha512_crypt
      salt_size: 16

  tasks:
    - name: Install core packages
      community.general.pacman:
        update_cache: true
        name: "{{ (['linux', 'efibootmgr'] + (core_packages | default([], true))) | unique }}"
        state: present

    - name: Set timezone
      ansible.builtin.file:
        src: "/usr/share/zoneinfo/{{ timezone }}"
        dest: /etc/localtime
        state: link
        force: true

    - name: Generate locales
      community.general.locale_gen:
        name: "{{ locale }}"
        state: present

    - name: Set system language
      ansible.builtin.copy:
        content: "LANG={{ lang }}\n"
        dest: /etc/locale.conf

    - name: Set console keymap
      ansible.builtin.copy:
        content: "KEYMAP={{ console_keymap }}\n"
        dest: /etc/vconsole.conf

    - name: Set hostname
      ansible.builtin.copy:
        content: "{{ hostname }}\n"
        dest: /etc/hostname

    - name: Add localhost to /etc/hosts
      ansible.builtin.copy:
        content: "127.0.0.1 localhost\n::1 localhost\n"
        dest: /etc/hosts

    - name: Set up systemd-boot
      block:
        - name: Install systemd-boot
          ansible.builtin.command:
            cmd: bootctl install --esp-path=/boot --variables=no
            creates: /boot/EFI/systemd/systemd-bootx64.efi

        - name: Get ESP disk, partition number, root UUID and UEFI boot entries
          ansible.builtin.shell: lsblk -no PKNAME,PARTN,PARTUUID "$(findmnt -no SOURCE /boot)" && findmnt -no UUID / && efibootmgr
          register: boot_info
          changed_when: false

        - name: Create UEFI boot entry
          ansible.builtin.command: >-
            efibootmgr --create --disk /dev/{{ boot_info.stdout.split()[0] }} --part {{ boot_info.stdout.split()[1] }} --loader '\EFI\systemd\systemd-bootx64.efi' --label 'Linux Boot Manager'
          when: boot_info.stdout_lines | select('search', 'Linux Boot Manager') | select('search', boot_info.stdout.split()[2]) | list | length == 0

        - name: Create boot entry
          ansible.builtin.copy:
            content: |
              title Arch Linux
              linux /vmlinuz-linux
              initrd /initramfs-linux.img
              options root=UUID={{ boot_info.stdout.split()[3] }} {{ kernel_params }}
            dest: /boot/loader/entries/arch.conf

        - name: Enable systemd-boot updates
          ansible.builtin.systemd_service:
            name: systemd-boot-update.service
            enabled: true

    - name: Run pre-install script
      when: pre_install_script | default('', true) | length > 0
      block:
        - name: Run pre-install script
          ansible.builtin.script:
            cmd: "{{ pre_install_script }}"
          register: pre_install_result
          failed_when: false

        - name: Show pre-install script errors
          ansible.builtin.debug:
            msg: "{{ pre_install_result.stdout_lines | map('regex_replace', '\\x1b(\\[[0-?]*[ -/]*[@-~]|\\][^\\x07\\x1b]*(\\x07|\\x1b\\\\)|\\([0-9A-Za-z])', '') | list }}"
          when: pre_install_result.rc != 0

        - name: Stop if the pre-install script failed
          ansible.builtin.fail:
            msg: "pre-install script exited with code {{ pre_install_result.rc }}"
          when: pre_install_result.rc != 0

    - name: Upgrade system
      community.general.pacman:
        update_cache: true
        upgrade: true
        upgrade_extra_args: "{{ pacman_upgrade_flags | default('', true) }}"

    - name: Install packages
      community.general.pacman:
        name: "{{ lookup('file', packages).splitlines() | map('trim') | reject('match', '#|$') | list }}"
        state: present
        extra_args: "{{ pacman_install_flags | default('', true) }}"
      when: packages | default('', true) | length > 0

    - name: Create user
      ansible.builtin.user:
        name: "{{ username }}"
        password: "{{ user_password_hash }}"
        groups: "{{ user_groups | default(omit, true) }}"
        shell: "{{ user_shell | default(omit, true) }}"
        append: true
      no_log: true

    - name: Allow wheel group to use sudo
      ansible.builtin.copy:
        content: "%wheel ALL=(ALL:ALL) ALL\n"
        dest: /etc/sudoers.d/00-wheel
        mode: "0440"
        validate: visudo -cf %s
      when: "'wheel' in (user_groups | default([], true))"

    - name: Run post-install user script
      when: post_install_script | default('', true) | length > 0
      block:
        - name: Allow passwordless sudo for the post-install script
          ansible.builtin.copy:
            content: |
              Defaults:{{ username }} verifypw=any
              {{ username }} ALL=(ALL:ALL) NOPASSWD: ALL
            dest: /etc/sudoers.d/zz-post-install
            mode: "0440"
            validate: visudo -cf %s

        - name: Run post-install user script
          become: true
          become_user: "{{ username }}"
          ansible.builtin.script:
            cmd: "{{ post_install_script }}"
          environment:
            PATH: "{{ ansible_facts.env.PATH }}:/usr/bin/site_perl:/usr/bin/vendor_perl:/usr/bin/core_perl"
          register: post_install_result
          failed_when: false

        - name: Show post-install script errors
          ansible.builtin.debug:
            msg: "{{ post_install_result.stdout_lines | map('regex_replace', '\\x1b(\\[[0-?]*[ -/]*[@-~]|\\][^\\x07\\x1b]*(\\x07|\\x1b\\\\)|\\([0-9A-Za-z])', '') | list }}"
          when: post_install_result.rc != 0

        - name: Stop if the post-install script failed
          ansible.builtin.fail:
            msg: "post-install script exited with code {{ post_install_result.rc }}"
          when: post_install_result.rc != 0

      always:
        - name: Remove passwordless sudo
          ansible.builtin.file:
            path: /etc/sudoers.d/zz-post-install
            state: absent

    - name: Enable services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
      loop: "{{ services_enabled | default([], true) }}"

    - name: Disable services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
      loop: "{{ services_disabled | default([], true) }}"

    - name: Mask services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        masked: true
      loop: "{{ services_masked | default([], true) }}"

    - name: Update initramfs
      ansible.builtin.command:
        cmd: mkinitcpio -P

    - name: Set root password
      ansible.builtin.user:
        name: root
        password: "{{ user_password_hash }}"
      no_log: true



