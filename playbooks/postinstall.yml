- name: Postinstall
  hosts: chroot

  vars_prompt:
    - name: user_password_hash
      prompt: Password for root and user
      private: true
      confirm: true
      encrypt: sha512_crypt
      salt_size: 16

  vars:
    timezone: Europe/Stockholm
    locale: en_US.UTF-8
    lang: en_US.UTF-8
    hostname: archlinux
    username: pavel
    user_groups: [wheel]
    user_shell: /usr/bin/zsh
    packages: packages.txt
    pacman_install_flags: --overwrite '/opt/*'
    pre_install_script: files/pre-install.sh
    post_install_script: files/post-install.sh

    GPU_drivers: [intel]
    gpu_packages:
      nvidia: [nvidia-open, nvidia-utils, lib32-nvidia-utils, libva-nvidia-driver]
      amd: [mesa, lib32-mesa, vulkan-radeon, lib32-vulkan-radeon]
      intel: [mesa, lib32-mesa, vulkan-intel, lib32-vulkan-intel, intel-media-driver]

    services_enabled:
      - iwd
      - lidm
      - chronyd-sync
    services_disabled:
      - systemd-networkd.service
      - systemd-networkd.socket
      - systemd-networkd-resolve-hook.socket
      - systemd-networkd-varlink.socket
      - systemd-resolved.service
      - systemd-resolved-monitor.socket
      - systemd-resolved-varlink.socket
      - getty@tty1.service
      - systemd-timesyncd.service
      - systemd-userdbd.service
      - systemd-userdbd.socket
    services_masked:
      - user@.service
      - rtkit-daemon


  tasks:
    - name: Set timezone
      ansible.builtin.file:
        src: "/usr/share/zoneinfo/{{ timezone }}"
        dest: /etc/localtime
        state: link
        force: true

    - name: Generate locales
      community.general.locale_gen:
        name: "{{ locale }}"
        state: present

    - name: Set system language
      ansible.builtin.copy:
        content: "LANG={{ lang }}\n"
        dest: /etc/locale.conf

    - name: Set hostname
      ansible.builtin.copy:
        content: "{{ hostname }}\n"
        dest: /etc/hostname

    - name: Install systemd-boot
      ansible.builtin.command:
        cmd: bootctl install --esp-path=/boot --variables=yes
        creates: /boot/EFI/systemd/systemd-bootx64.efi

    - name: Get root filesystem UUID
      ansible.builtin.command: findmnt -no UUID /
      register: root_uuid
      changed_when: false

    - name: Create boot entry
      ansible.builtin.copy:
        content: |
          title Arch Linux
          linux /vmlinuz-linux
          initrd /intel-ucode.img
          initrd /initramfs-linux.img
          options root=UUID={{ root_uuid.stdout }} rw nvidia.NVreg_RegistryDwords=RmDisableDisplayGlitchPerfLimit=1
        dest: /boot/loader/entries/arch.conf

    - name: Set root password
      ansible.builtin.user:
        name: root
        password: "{{ user_password_hash }}"
      no_log: true

    - name: Create user
      ansible.builtin.user:
        name: "{{ username }}"
        password: "{{ user_password_hash }}"
        groups: "{{ user_groups }}"
        shell: "{{ user_shell }}"
        append: true
      no_log: true

    - name: Run pre-install script
      ansible.builtin.script:
        cmd: "{{pre_install_script}}"
      when: pre_install_script | default('', true) | length > 0

    - name: Upgrade system
      community.general.pacman:
        update_cache: true
        upgrade: true
        upgrade_extra_args: --ask=4

    - name: Install GPU drivers
      community.general.pacman:
        name: "{{ GPU_drivers | map('extract', gpu_packages) | flatten | unique }}"
        state: present

    - name: Install packages
      community.general.pacman:
        name: "{{ lookup('file', packages).splitlines() | map('trim') | reject('match', '#|$') | list }}"
        state: present
        extra_args: "{{pacman_install_flags}}"

    - name: Run post-install user script
      when: post_install_script | default('', true) | length > 0
      block:
        - name: Allow passwordless sudo for the post-install script
          ansible.builtin.copy:
            content: |
              Defaults:{{ username }} verifypw=any
              {{ username }} ALL=(ALL:ALL) NOPASSWD: ALL
            dest: /etc/sudoers.d/zz-post-install
            mode: "0440"
            validate: visudo -cf %s

        - name: Run post-install user script
          become: true
          become_user: "{{ username }}"
          ansible.builtin.script:
            cmd: "{{ post_install_script }}"
          environment:
            PATH: "{{ ansible_env.PATH }}:/usr/bin/site_perl:/usr/bin/vendor_perl:/usr/bin/core_perl"

      always:
        - name: Remove passwordless sudo
          ansible.builtin.file:
            path: /etc/sudoers.d/zz-post-install
            state: absent

    - name: Enable services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
      loop: "{{ services_enabled }}"

    - name: Disable services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
      loop: "{{ services_disabled }}"

    - name: Mask services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        masked: true
      loop: "{{ services_masked }}"



